<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google" content="notranslate">
    
    <title>Geek Base | gb.ooo</title>
    <meta name="description" content="Geek Base - 极客基地。汇集极客导航、开源排行与各类数字实验。">
    
    <!-- 🚫 屏蔽搜索引擎收录 -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    
    <!-- 引入极客字体 -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body {
            width: 100%; height: 100%;
            background: #000;
            overflow: hidden;
            font-family: 'JetBrains Mono', monospace; /* 极客等宽字体 */
            color: #fff;
        }

        /* 画布背景层 */
        #canvas-bg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        /* 边缘暗角，让视觉聚焦在中心 */
        .vignette {
            position: absolute;
            z-index: 2;
            width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 20%, #000 90%);
            pointer-events: none;
        }

        /* 中心内容区 */
        .content-wrapper {
            position: relative;
            z-index: 3;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* 主标题 */
        .main-title {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 4px;
            margin-bottom: 4rem;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(255,255,255,0.3);
        }

        /* 矩阵容器 */
        .matrix-container {
            display: flex;
            gap: 4rem; /* 菱形之间的间距要拉大，因为旋转后会占用更多空间 */
            justify-content: center;
            align-items: center;
        }

        /* 🌟 核心：菱形卡片 */
        .entity {
            position: relative;
            width: 10rem;
            height: 10rem;
            background: radial-gradient(circle at center, rgba(20,20,20,0.9), rgba(5,5,5,0.9));
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 4px;
            /* 旋转 45 度变成菱形 */
            transform: rotate(45deg);
            /* 浮动动画 */
            animation: float 6s ease-in-out infinite;
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            text-decoration: none;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 内部内容反向旋转回来，保持正立 */
        .inner-content {
            transform: rotate(-45deg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
        }

        .entity .icon {
            font-size: 2.5rem;
            margin-bottom: 8px;
            transition: transform 0.5s ease;
        }

        .entity .title {
            font-size: 1rem;
            font-weight: 700;
            color: #ddd;
            margin-bottom: 4px;
        }
        .entity .desc {
            font-size: 0.75rem;
            color: #777;
        }

        /* 🌟 Hover 特效：发光、变白、放大 */
        .entity:hover {
            border-color: rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.2), inset 0 0 20px rgba(255,255,255,0.1);
            z-index: 10;
        }
        .entity:hover .title { color: #fff; }
        .entity:hover .desc { color: #aaa; }
        .entity:hover .icon { transform: scale(1.2); }

        /* 错开浮动时间 */
        .entity:nth-child(2n) { animation-delay: -3s; }

        /* 浮动动画关键帧（注意必须带上 rotate(45deg)，否则动画会覆盖旋转） */
        @keyframes float {
            0% { transform: translateY(0) rotate(45deg); }
            50% { transform: translateY(-15px) rotate(45deg); }
            100% { transform: translateY(0) rotate(45deg); }
        }

        /* 移动端适配 */
        @media (max-width: 600px) {
            .matrix-container { gap: 3rem; flex-direction: row; flex-wrap: wrap; }
            .entity { width: 8rem; height: 8rem; }
            .entity .icon { font-size: 2rem; }
            .entity .title { font-size: 0.85rem; }
            .main-title { margin-bottom: 3rem; font-size: 1.6rem; }
        }
    </style>
</head>
<body>

    <!-- 背景粒子 -->
    <canvas id="canvas-bg"></canvas>
    <div class="vignette"></div>

    <!-- 内容区 -->
    <div class="content-wrapper">
        <div class="main-title">Geek Base</div>

        <div class="matrix-container">
            
            <!-- 卡片 1 -->
            <a href="https://nav.gb.ooo" class="entity">
                <div class="inner-content">
                    <div class="icon">🌐</div>
                    <div class="title">Geek Nav</div>
                    <div class="desc">极客导航</div>
                </div>
            </a>

            <!-- 卡片 2 -->
            <a href="https://grank.gb.ooo" class="entity">
                <div class="inner-content">
                    <div class="icon">📊</div>
                    <div class="title">GitHub Rank</div>
                    <div class="desc">开源排行</div>
                </div>
            </a>

            <!-- 卡片 3 (后期添加)
            <a href="https://blog.gb.ooo" class="entity">
                <div class="inner-content">
                    <div class="icon">📝</div>
                    <div class="title">Blog</div>
                    <div class="desc">折腾笔记</div>
                </div>
            </a>
            -->

        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        let width, height;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // 核心修改：强制粒子只能走 4 个对角线方向，形成交叉网格
        const directions = [
            { x: 1, y: 1 },   // 右下
            { x: -1, y: -1 }, // 左上
            { x: 1, y: -1 },  // 右上
            { x: -1, y: 1 }   // 左下
        ];

        class Mote {
            constructor() {
                this.reset(true);
            }
            
            reset(randomPos = false) {
                if (randomPos) {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                } else {
                    // 如果越界，从屏幕外重新进入，形成无缝循环
                    this.x = Math.random() > 0.5 ? 0 : width;
                    this.y = Math.random() * height;
                }
                
                // 随机挑选一个方向，速度随机（形成长短不一的线条）
                const dir = directions[Math.floor(Math.random() * directions.length)];
                const speed = 1 + Math.random() * 2; 
                this.vx = dir.x * speed;
                this.vy = dir.y * speed;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                // 如果出界，重置
                if (this.x < 0 || this.x > width || this.y < 0 || this.y > height) {
                    this.reset();
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, 1.5, 0, Math.PI * 2); // 笔触更细
                ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
                ctx.fill();
                ctx.closePath();
            }
        }

        const particles = [];
        // 增加粒子数量，形成密集的流星雨网格
        for (let i = 0; i < 100; i++) {
            particles.push(new Mote());
        }

        function animate() {
            // 关键：用极低透明度的黑色清空画布，形成很长的“拖影”
            ctx.fillStyle = "rgba(0, 0, 0, 0.06)"; 
            ctx.fillRect(0, 0, width, height);

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
